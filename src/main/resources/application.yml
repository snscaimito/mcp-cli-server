spring:
  application:
    name: mcp-cli-server
  ai:
    mcp:
      server:
        name: mcp-cli-server
        version: "@project.version@"
        type: SYNC
        protocol: STREAMABLE
  threads:
    virtual:
      enabled: true
server:
  address: 127.0.0.1
  port: 80
mcp:
  cli:
    directory: ${MCP_CLI_DIRECTORY:/usr/lib/mcp-cli-server/demo-clis}
    discovery-timeout: 5s
    invocation-timeout: 60s
    change-debounce: 500ms
    reconciliation-interval: 30s
    max-stdout-bytes: 1048576
    max-stderr-bytes: 65536
    max-concurrent-invocations: 16
    environment-allowlist: [HOME, USER, LANG, LC_ALL, TZ]
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
