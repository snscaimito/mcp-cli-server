name: Publish signed APT repository

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version, with or without a v prefix
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: apt-repository
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-go@v6
        with:
          go-version-file: demo/hello-world-cli/go.mod
      - id: version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [[ -z "$version" ]]; then version="${GITHUB_REF_NAME#v}"; fi
          version="${version#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Release tags must be vMAJOR.MINOR.PATCH" >&2; exit 1; }
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Build and test Debian package
        run: ./mvnw --batch-mode -Drevision="${{ steps.version.outputs.value }}" clean package
      - name: Install APT repository tools
        run: sudo apt-get update && sudo apt-get install --yes apt-utils dpkg-dev gnupg
      - name: Import archive signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: |
          [[ -n "$APT_SIGNING_KEY" && -n "$APT_SIGNING_PASSPHRASE" ]] || { echo "APT signing secrets are required" >&2; exit 1; }
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          fingerprint=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')
          [[ -n "$fingerprint" ]] || { echo "No signing key was imported" >&2; exit 1; }
          echo "APT_SIGNING_KEY_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"
      - name: Build signed APT repository
        env:
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: scripts/build-apt-repository.sh apt-repository "target/mcp-cli-server-${{ steps.version.outputs.value }}.deb"
      - name: Publish APT repository branch
        run: scripts/publish-apt-branch.sh apt-repository "Publish APT repository ${{ steps.version.outputs.value }}"
